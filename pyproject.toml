[build-system]
# setuptools 64 is the first release with the PEP 660 build_editable
# hook. Below that, `pip install -e .` fails outright on a project
# with no setup.py -- which is what the documented source install does.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2top"
dynamic = ["version"]
description = "A real-time process monitor with support for ROS2 nodes, showing CPU, RAM, and GPU usage"
readme = "README.md"
requires-python = ">=3.8"
# The PEP 639 expression form (license = "MIT") needs setuptools >= 77, which
# dropped Python 3.8 -- and this project still supports 3.8. This form is
# understood by every setuptools from 61 up.
license = { text = "MIT" }
authors = [
  { name = "Ahmed Radwan", email = "ahmed.ali.radwan94@gmail.com" },
]
keywords = ["monitoring", "process", "ros2", "gpu", "cpu", "memory", "nodes", "system"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "psutil>=5.8.0",
  "pynvml>=11.0.0",
]

[project.scripts]
ros2top = "ros2top.main:main"

# Makes the same monitor available as `ros2 top` wherever ros2cli is installed.
# ros2cli finds it by entry point, so nothing in ros2cli has to change.
[project.entry-points."ros2cli.command"]
top = "ros2top.command.top:TopCommand"

[project.urls]
Homepage = "https://github.com/AhmedARadwan/ros2top"
"Bug Reports" = "https://github.com/AhmedARadwan/ros2top/issues"
Source = "https://github.com/AhmedARadwan/ros2top"

[tool.setuptools.dynamic]
version = { attr = "ros2top.__version__" }

[tool.setuptools.packages.find]
include = ["ros2top*"]
exclude = ["cmake*", "include*", "tests*", "build*"]

# Data-file declarations (optional): include headers and cmake scripts
[tool.setuptools.data-files]
"include/ros2top" = ["include/ros2top/*.hpp"]
"share/ros2top/cmake" = ["cmake/*.cmake"]
