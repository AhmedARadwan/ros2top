<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 180" width="548" height="180" role="img" aria-label="ros2top">
  <title>ros2top</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a24"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#56b6c2"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2431"/>
      <stop offset="1" stop-color="#111823"/>
    </linearGradient>
  </defs>

  <!-- Card. The mark carries its own background so it reads the same on a
       light or a dark README, where an <img> gets no theme information. -->
  <rect width="548" height="180" rx="26" fill="url(#card)"/>
  <rect x="0.75" y="0.75" width="546.5" height="178.5" rx="25.25" fill="none"
        stroke="#2dd4bf" stroke-opacity="0.16"/>

  <!-- Icon tile -->
  <g transform="translate(34 34)">
    <rect width="112" height="112" rx="24" fill="url(#tile)"/>
    <rect x="0.75" y="0.75" width="110.5" height="110.5" rx="23.25" fill="none"
          stroke="#a78bfa" stroke-opacity="0.22"/>

    <!-- Resource bars: what `top` shows -->
    <g fill="url(#accent)">
      <rect x="24" y="66" width="12" height="24" rx="6"/>
      <rect x="44" y="52" width="12" height="38" rx="6"/>
      <rect x="64" y="34" width="12" height="56" rx="6"/>
    </g>
    <!-- ...and the graph those processes form: nodes joined by edges -->
    <path d="M30 60 L50 46 L70 28" fill="none" stroke="#e2e8f0"
          stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#0f1620" stroke="#e2e8f0" stroke-width="2.5">
      <circle cx="30" cy="60" r="5.5"/>
      <circle cx="50" cy="46" r="5.5"/>
      <circle cx="70" cy="28" r="5.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="180" y="96" font-size="58" font-weight="700" fill="#e6edf3"
          letter-spacing="-1">ros2<tspan fill="url(#accent)">top</tspan></text>
    <text x="182" y="128" font-size="17" fill="#8b949e" letter-spacing="1.7">
      htop for your ROS 2 graph
    </text>
  </g>

  <!-- Cursor, blinking as a terminal one does. Static viewers get it solid. -->
  <rect x="468" y="56" width="13" height="46" rx="2" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.15s"
             calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
